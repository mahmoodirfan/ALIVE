name: Rebuild ALIVE source

on:
  push:
    paths:
      - '.rebuild/READY'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct Phase 5 source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .rebuild/part00 \
            .rebuild/part01 \
            .rebuild/part02_03 \
            .rebuild/part04_07 \
            .rebuild/fix04_07 \
            .rebuild/part08_11 \
            .rebuild/fix08_11 \
            .rebuild/part12_15 \
            .rebuild/fix12_15 \
            .rebuild/part16_19 \
            .rebuild/fix16_19 \
            .rebuild/part20_21 \
            | tr -d '\r\n\t ' \
            | base64 --decode --ignore-garbage > /tmp/alive.tar.xz

          echo 'd7cf3edb4697a23bfa4944541d83cecd837e6c93a6a790fafefc6931752cd07b  /tmp/alive.tar.xz' | sha256sum -c -
          xz -t /tmp/alive.tar.xz

          mkdir -p /tmp/alive-src
          tar -xJf /tmp/alive.tar.xz -C /tmp/alive-src
          test -f /tmp/alive-src/ALIVE/package.json
          test -f /tmp/alive-src/ALIVE/apps/demo-store/package.json
          test -f /tmp/alive-src/ALIVE/packages/core/package.json

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/alive-src/ALIVE/. .

      - name: Commit clean source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import ALIVE Phase 5 showcase'
          git push origin HEAD:main
