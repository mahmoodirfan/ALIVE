name: Rebuild ALIVE source

on:
  push:
    paths:
      - '.rebuild/READY'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct Phase 5 source
        shell: bash
        run: |
          set -euo pipefail
          cat .rebuild/part* | tr -d '\n' | base64 --decode > /tmp/alive.tar.xz
          mkdir -p /tmp/alive-src
          tar -xJf /tmp/alive.tar.xz -C /tmp/alive-src
          test -f /tmp/alive-src/ALIVE/package.json
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/alive-src/ALIVE/. .

      - name: Commit clean source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import ALIVE Phase 5 showcase'
          git push origin HEAD:main
