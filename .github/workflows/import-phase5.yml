name: Import ALIVE Phase 5

on:
  push:
    paths:
      - '.source/alive-phase5.tar.xz'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and import source
        shell: bash
        run: |
          set -euo pipefail
          echo '45c2321c8f525c90affd4ef988f47fc1532dd2bbcec32469a0c922103014ba6e  .source/alive-phase5.tar.xz' | sha256sum -c -
          xz -t .source/alive-phase5.tar.xz
          rm -rf /tmp/alive-src
          mkdir -p /tmp/alive-src
          tar -xJf .source/alive-phase5.tar.xz -C /tmp/alive-src
          test -f /tmp/alive-src/ALIVE/package.json
          test -f /tmp/alive-src/ALIVE/apps/demo-store/package.json
          test -f /tmp/alive-src/ALIVE/packages/core/package.json
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/alive-src/ALIVE/. .
      - name: Commit clean Phase 5 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import ALIVE Phase 5 showcase'
          git push origin HEAD:main
